name: Daily Current Affairs Updater

on:
  schedule:
    - cron: '30 1 * * *' # Runs automatically every day at 1:30 AM UTC
  workflow_dispatch:     # Allows you to trigger it manually from GitHub anytime

jobs:
  run-updater:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install supabase google-genai requests feedparser

      - name: Run updater script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python updater.py