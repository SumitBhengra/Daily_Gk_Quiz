<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily GK & Current Affairs Quiz</title>
    <style>
        :root { 
            --primary: #4f46e5; 
            --primary-hover: #4338ca;
            --bg: #f8fafc; 
            --card: #ffffff; 
            --text: #0f172a; 
            --text-muted: #64748b;
            --border: #e2e8f0; 
            --success-bg: #dcfce7;
            --success-border: #22c55e;
            --success-text: #166534;
            --error-bg: #fee2e2;
            --error-border: #ef4444;
            --error-text: #991b1b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            padding: 2rem 1rem; 
            line-height: 1.6; 
        }

        header { 
            text-align: center; 
            margin-bottom: 2rem; 
            background: var(--card); 
            padding: 2rem; 
            border-radius: 16px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        header h1 { color: var(--primary); font-size: 2rem; margin-bottom: 0.5rem; font-weight: 700; }
        header p { color: var(--text-muted); font-size: 1rem; }

        .controls-wrapper {
            max-width: 1000px;
            margin: 0 auto 1.5rem auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .controls-top-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .tab-group {
            display: flex;
            gap: 0.5rem;
        }

        .control-btn {
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: white;
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            display: grid; 
            gap: 1.5rem; 
        }

        @media(min-width: 768px) { 
            .container { grid-template-columns: 1fr 1fr; } 
        }

        /* Sub-category container styling */
        .sub-category-wrapper {
            width: 100%;
            padding-top: 8px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: center;
        }

        .scrollable-tabs {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            white-space: nowrap;
            padding: 4px 0;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .scrollable-tabs::-webkit-scrollbar {
            display: none;
        }

        /* Sub-category Pills */
        .sub-chip {
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background-color: #f8fafc;
            color: #475569;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sub-chip.active {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .card { 
            background: var(--card); 
            padding: 2rem; 
            border-radius: 16px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); 
            border: 1px solid var(--border); 
            display: flex;
            flex-direction: column;
        }

        .card h2 { 
            font-size: 1.25rem; 
            margin-bottom: 1.25rem; 
            color: var(--text);
            border-bottom: 2px solid var(--border); 
            padding-bottom: 0.75rem; 
        }

        .notes-list { padding-left: 1.2rem; display: flex; flex-direction: column; gap: 0.75rem; }
        .notes-list li { font-size: 0.95rem; color: #334155; line-height: 1.5; }

        .quiz-question { 
            font-weight: 600; 
            margin-bottom: 1.25rem; 
            font-size: 1.05rem;
        }

        #options-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            flex-grow: 1;
        }

        .option-btn { 
            display: block; 
            width: 100%; 
            background: #ffffff; 
            border: 1px solid var(--border); 
            padding: 0.85rem 1rem; 
            border-radius: 10px; 
            text-align: left; 
            cursor: pointer; 
            font-size: 0.95rem;
            color: var(--text);
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) { 
            background: #f1f5f9; 
            border-color: var(--primary); 
            transform: translateY(-1px);
        }

        .option-btn.correct { 
            background: var(--success-bg); 
            border-color: var(--success-border); 
            color: var(--success-text); 
            font-weight: 600; 
        }

        .option-btn.incorrect { 
            background: var(--error-bg); 
            border-color: var(--error-border); 
            color: var(--error-text); 
        }

        .explanation { 
            margin-top: 1.25rem; 
            padding: 1rem; 
            background: #f8fafc; 
            border-left: 4px solid var(--primary); 
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem; 
            color: #334155;
            display: none; 
        }

        .next-btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 0.75rem 1.5rem; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 600; 
            margin-top: 1.25rem; 
            display: none; 
            align-self: flex-end;
            transition: background 0.2s;
        }

        .next-btn:hover { background: var(--primary-hover); }
        .empty-state { color: var(--text-muted); font-style: italic; }
    </style>
</head>
<body>

    <header>
        <h1>Daily Current Affairs & GK Hub</h1>
        <p>Targeted Exam Notes & Practice Quiz</p>
    </header>

    <!-- Navigation Controls (Category + Date Switchers) -->
    <div class="controls-wrapper">
        <div class="controls-top-row">
            <!-- Tier 1: Main Category (National vs International) -->
            <div class="tab-group primary-tabs">
                <button id="btn-national" class="control-btn active" onclick="switchCategory('National')">🇮🇳 National</button>
                <button id="btn-international" class="control-btn" onclick="switchCategory('International')">🌍 International</button>
            </div>

            <!-- Date Group -->
            <div class="tab-group">
                <button id="btn-today" class="control-btn active" onclick="switchDate('today')">📅 Today</button>
                <button id="btn-yesterday" class="control-btn" onclick="switchDate('yesterday')">⏮️ Yesterday</button>
            </div>
        </div>

        <!-- Tier 2: Sub-category Filter Chips -->
        <div class="sub-category-wrapper">
            <div class="tab-group scrollable-tabs">
                <button class="sub-chip active" onclick="switchSubCategory('all', this)">All Topics</button>
                <button class="sub-chip" onclick="switchSubCategory('Governance & Policies', this)">🏛️ Governance</button>
                <button class="sub-chip" onclick="switchSubCategory('Economy', this)">📈 Economy</button>
                <button class="sub-chip" onclick="switchSubCategory('Science & Tech', this)">🚀 Sci-Tech</button>
                <button class="sub-chip" onclick="switchSubCategory('Environment', this)">🌱 Environment</button>
                <button class="sub-chip" onclick="switchSubCategory('Sports', this)">🏅 Sports</button>
                <button class="sub-chip" onclick="switchSubCategory('Awards & Honors', this)">🏆 Awards</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Notes Column -->
        <div class="card">
            <h2>📝 Key Exam Notes</h2>
            <ul class="notes-list" id="notes-container">
                <li>Loading notes...</li>
            </ul>
        </div>

        <!-- Quiz Column -->
        <div class="card">
            <h2>🧠 Practice Quiz</h2>
            <div id="quiz-container">
                <div class="quiz-question" id="question-text">Loading question...</div>
                <div id="options-container"></div>
                <div class="explanation" id="explanation-text"></div>
                <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = 'https://gprgdzahgyebsghbgoav.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwcmdkemFoZ3llYnNnaGJnb2F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMzQ4MzMsImV4cCI6MjEwMDgxMDgzM30.-Z81Ny21KV-jG820OcBiAWwaBIBtuLEjfZGZi8LIKeM';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;
        let quizData = [];

        // State Variables
        let currentCategory = 'National';     // 'National' or 'International'
        let currentSubCategory = 'all';        // 'all', 'Economy', 'Science & Tech', etc.
        let currentDateType = 'today';        // 'today' or 'yesterday'

        function getTargetDateString() {
            const d = new Date();
            if (currentDateType === 'yesterday') {
                d.setDate(d.getDate() - 1);
            }
            return d.toISOString().split('T')[0];
        }

        // 1. Primary Category Switcher (National vs International)
        window.switchCategory = function(cat) {
            currentCategory = cat;
            
            const isNational = cat.toLowerCase() === 'national';
            document.getElementById('btn-national').classList.toggle('active', isNational);
            document.getElementById('btn-international').classList.toggle('active', !isNational);
            
            window.loadData();
        };

        // 2. Sub-Category Switcher (Topics)
        window.switchSubCategory = function(subCat, element) {
            currentSubCategory = subCat;
            
            document.querySelectorAll('.sub-chip').forEach(chip => {
                chip.classList.remove('active');
            });
            if (element) {
                element.classList.add('active');
            }
            
            window.loadData();
        };

        // 3. Date Switcher (Today vs Yesterday)
        window.switchDate = function(type) {
            currentDateType = type;
            document.getElementById('btn-today').classList.toggle('active', type === 'today');
            document.getElementById('btn-yesterday').classList.toggle('active', type === 'yesterday');
            window.loadData();
        };

        window.loadData = async function() {
            const targetDate = getTargetDateString();
            currentQuestionIndex = 0; 
            score = 0;
            answered = false;
            
            // Query Notes from Supabase
            // Query Notes from Supabase
            let notesQuery = supabase
                .from('current_affairs_notes')
                .select('note_text')
                .eq('date', targetDate)
                .ilike('category', currentCategory); // Changed .eq to .ilike

            // Filter by Sub-Category if not 'all'
            if (currentSubCategory !== 'all') {
                notesQuery = notesQuery.ilike('sub_category', currentSubCategory); // Changed to .ilike here too just to be safe!
            }

            const { data: notes } = await notesQuery;

            const notesContainer = document.getElementById('notes-container');
            if (notes?.length) {
                notesContainer.innerHTML = notes.map(n => `<li>${n.note_text}</li>`).join('');
            } else {
                notesContainer.innerHTML = `<p class="empty-state">No ${currentCategory} notes found for ${currentSubCategory === 'all' ? '' : currentSubCategory + ' on '} ${currentDateType} (${targetDate}).</p>`;
            }

            // Query Quizzes from Supabase
            let quizQuery = supabase
                .from('daily_quizzes')
                .select('*')
                .eq('date', targetDate)
                .eq('category', currentCategory);

            const { data: quizzes } = await quizQuery;

            if (quizzes?.length) { 
                quizData = quizzes.map(q => {
                    const optionsWithIndices = q.options.map((opt, idx) => ({ opt, originalIdx: idx }));
                    for (let i = optionsWithIndices.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [optionsWithIndices[i], optionsWithIndices[j]] = [optionsWithIndices[j], optionsWithIndices[i]];
                    }
                    const newOptions = optionsWithIndices.map(item => item.opt);
                    const newCorrectIndex = optionsWithIndices.findIndex(item => item.originalIdx === q.correct_index);
                    
                    return {
                        ...q,
                        options: newOptions,
                        correct_index: newCorrectIndex
                    };
                });

                loadQuestion(); 
            } else { 
                document.getElementById('quiz-container').innerHTML = `<p class="empty-state">No quiz questions found for ${currentCategory} on ${currentDateType} (${targetDate}).</p>`; 
            }
        };

        function loadQuestion() {
            answered = false;
            const currentData = quizData[currentQuestionIndex];
            
            const quizContainer = document.getElementById('quiz-container');
            if (!document.getElementById('question-text')) {
                quizContainer.innerHTML = `
                    <div class="quiz-question" id="question-text"></div>
                    <div id="options-container"></div>
                    <div class="explanation" id="explanation-text"></div>
                    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question</button>
                `;
            }

            document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${currentData.question}`;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            currentData.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation-text').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
        }

        window.selectOption = function(selectedIndex, selectedBtn) {
            if (answered) return;
            answered = true;
            const currentData = quizData[currentQuestionIndex];
            const optionButtons = document.querySelectorAll('.option-btn');

            if (selectedIndex === currentData.correct_index) {
                selectedBtn.classList.add('correct');
                score++;
            } else {
                selectedBtn.classList.add('incorrect');
                optionButtons[currentData.correct_index].classList.add('correct');
            }

            optionButtons.forEach(b => b.disabled = true);
            const explanationEl = document.getElementById('explanation-text');
            explanationEl.innerText = "Explanation: " + currentData.explanation;
            explanationEl.style.display = 'block';

            const nextBtn = document.getElementById('next-btn');
            nextBtn.innerText = currentQuestionIndex < quizData.length - 1 ? "Next Question" : "View Final Score";
            nextBtn.style.display = 'block';
        };

        window.nextQuestion = function() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                document.getElementById('quiz-container').innerHTML = `
                    <div style="text-align: center; margin: auto; padding: 2rem;">
                        <h3 style="color: var(--primary); font-size: 1.5rem; margin-bottom: 0.5rem;">Quiz Completed! 🎉</h3>
                        <p style="font-size: 1.1rem; color: var(--text-muted); margin-bottom: 1.5rem;">You scored <strong>${score}</strong> out of <strong>${quizData.length}</strong></p>
                        <button class="next-btn" style="display: inline-block;" onclick="window.loadData()">Practice Again</button>
                    </div>
                `;
            }
        };

        window.loadData();
    </script>
</body>
</html>
